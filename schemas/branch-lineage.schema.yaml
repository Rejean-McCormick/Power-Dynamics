$schema: https://json-schema.org/draft/2020-12/schema
title: Branch Lineage
type: object
required:
- branch_id
properties:
  branch_id:
    type: string
  parents:
    type: array
  derived_from:
    type: array
  changes:
    type: array
  added_value_claims:
    type: array
  evidence:
    type: array
  compatibility:
    type: array
  governance:
    type:
    - string
    - object
    - 'null'
additionalProperties: true
