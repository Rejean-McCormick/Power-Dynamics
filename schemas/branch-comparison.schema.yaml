$schema: https://json-schema.org/draft/2020-12/schema
title: Branch Comparison
type: object
required:
- branches
- dimensions
properties:
  branches:
    type: array
    minItems: 2
  shared_problem:
    type:
    - string
    - 'null'
  dimensions:
    type: object
  unique_contributions:
    type: object
  complementarity:
    type:
    - string
    - object
    - 'null'
  dominance_factors:
    type: object
  no_global_winner_required:
    type: boolean
additionalProperties: true
