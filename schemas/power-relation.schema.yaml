$schema: https://json-schema.org/draft/2020-12/schema
title: Power Relation
type: object
required:
- holder
- affected_actor
- mechanism
properties:
  holder:
    type: string
  affected_actor:
    type: string
  domain:
    type: string
  puissance_basis:
    type: array
  mechanism:
    type: string
  effects_on_possibility:
    type: array
  scope:
    type:
    - string
    - object
  duration:
    type:
    - string
    - 'null'
  mandate:
    type:
    - string
    - 'null'
  dependency:
    type:
    - string
    - object
    - 'null'
  counterpowers:
    type: array
  contestability:
    type:
    - string
    - 'null'
  revocability:
    type:
    - string
    - 'null'
  exit_options:
    type: array
  evidence:
    type: array
additionalProperties: true
