$schema: https://json-schema.org/draft/2020-12/schema
title: Polycentric Recognition Policy
$comment: Exploratory data model, not a production kOA protocol or conformance claim.
type: object
additionalProperties: false
required: [policy_id, policy_version, reader_id, default_decision, recognition_rules]
properties:
  policy_id: {type: string, minLength: 1}
  policy_version: {type: string, minLength: 1}
  reader_id: {type: string, minLength: 1}
  effective_from: {type: string, format: date-time}
  description: {type: string}
  default_decision:
    enum: [deny, manual_review]
  recognition_rules:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [rule_id, issuer_id, domains, claim_types, decision]
      properties:
        rule_id: {type: string, minLength: 1}
        issuer_id: {type: string, minLength: 1}
        domains:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        claim_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        decision:
          enum: [accept, deny, manual_review]
        expires_at: {type: string, format: date-time}
        jurisdiction: {type: string}
        required_evidence:
          type: array
          items: {type: string}
        delegation:
          type: object
          additionalProperties: false
          required: [enabled, max_depth]
          properties:
            enabled: {type: boolean}
            max_depth: {type: integer, minimum: 0, maximum: 3}
            bounded_domains:
              type: array
              items: {type: string}
            bounded_claim_types:
              type: array
              items: {type: string}
            permitted_issuer_ids:
              type: array
              items: {type: string}
  exclusions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [issuer_id, reason]
      properties:
        issuer_id: {type: string}
        claim_type: {type: string}
        domain: {type: string}
        reason: {type: string}
        expires_at: {type: string, format: date-time}
  appeals_uri: {type: string, format: uri}
