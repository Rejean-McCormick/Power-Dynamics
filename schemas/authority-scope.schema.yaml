$schema: https://json-schema.org/draft/2020-12/schema
title: Authority Scope
type: object
required:
- role
- mandate
properties:
  role:
    type: string
  mandate:
    type: string
  domain:
    type: array
  jurisdiction:
    type:
    - string
    - 'null'
  duration:
    type:
    - string
    - 'null'
  delegation:
    type:
    - string
    - 'null'
  revocation:
    type:
    - string
    - 'null'
  review:
    type:
    - string
    - 'null'
  prohibited_conversions:
    type: array
additionalProperties: true
