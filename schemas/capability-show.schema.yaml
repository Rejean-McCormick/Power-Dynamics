$schema: https://json-schema.org/draft/2020-12/schema
title: Capability Show Profile
type: object
required:
- capability_name
- baseline_limitation
- generated_puissance
properties:
  capability_name:
    type: string
  scope:
    type: string
  baseline_limitation:
    type: string
  resources:
    type: array
    items: {}
  mechanisms:
    type: array
    items: {}
  capacities:
    type: array
    items: {}
  generated_puissance:
    type: array
    items: {}
  composition_gain:
    type: array
    items: {}
  returns:
    type: array
    items: {}
  compounding_loops:
    type: array
    items: {}
  possible_power_relations:
    type: array
    items: {}
  conversion_paths:
    type: array
    items: {}
  blocked_conversions:
    type: array
    items: {}
  counterpowers:
    type: array
    items: {}
  branch_alternatives:
    type: array
    items: {}
  evidence:
    type: array
    items: {}
  maturity:
    type:
    - string
    - 'null'
  technical_evidence_confidence:
    type:
    - string
    - 'null'
  power_routing:
    type: object
    description: Where capability, authority, returns, and optionality are routed.
    properties:
      capability_recipients:
        type: array
        items:
          type: string
      authority_recipients:
        type: array
        items:
          type: string
      return_recipients:
        type: array
        items:
          type: string
      optionality_recipients:
        type: array
        items:
          type: string
      redirection_mechanisms:
        type: array
        items:
          type: string
      retained_central_rights:
        type: array
        items:
          type: string
    additionalProperties: false
additionalProperties: true
